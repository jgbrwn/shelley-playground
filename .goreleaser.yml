version: 2

before:
  hooks:
    - go mod tidy
    - python3 scripts/fetch-exe-scroll.py --all --wait 900

builds:
  - id: shelley
    binary: shelley
    main: ./cmd/shelley
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X shelley.exe.dev/version.Version={{ .Version }}
      - -X shelley.exe.dev/version.Tag={{ .Tag }}

archives:
  - id: shelley
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'typo'

release:
  github:
    owner: jgbrwn
    name: shelley-playground
  draft: false
  prerelease: auto

# No Homebrew cask for the playground fork — upstream's tap (boldsoftware/tap)
# remains the canonical install for mainline Shelley. Playground users install
# from the GitHub Releases page or build from source via `make build-custom`.
