name: Sync upstream & release

# Keeps shelley-playground fresh: every day at 03:00 UTC (and on demand),
# fetch upstream boldsoftware/shelley main, rebase the playground commits
# onto it, and publish. The rebased tree is pushed to the sync-candidate
# branch and must pass the Test workflow there before it becomes main, so an
# automatic conflict resolution can never ship a broken main; a candidate
# that fails stays on that branch for inspection. Promoting main runs Test
# and then Release as for any push. If upstream hasn't moved, release this
# commit only when its version tag does not exist.
#
# Conflicts the deterministic resolver refuses (both sides edited the same
# lines) go to Copilot CLI when the COPILOT_GITHUB_TOKEN secret is set. Its
# resolution must pass the same Test gate; each one is published as a
# "sync-ai-resolved" issue for review after the fact.
#
# Any failure opens (or comments on) one "sync-failure" issue, which the next
# successful sync closes, so a stuck sync is never silent.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: playground-upstream-sync
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    env:
      HAS_COPILOT: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
    outputs:
      rebased: ${{ steps.check.outputs.rebased }}
      main: ${{ steps.check.outputs.main }}
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout playground main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Copilot may run in this checkout: keep every credential out of
          # it. Only the push step below sees the push token.
          persist-credentials: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Copilot CLI
        if: env.HAS_COPILOT == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_COPILOT == 'true'
        run: npm install --global @github/copilot@1.0.114

      - name: Add upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/boldsoftware/shelley.git
          else
            git remote add upstream https://github.com/boldsoftware/shelley.git
          fi
          git fetch upstream main --tags --prune

      - name: Check upstream state
        id: check
        run: |
          set -e
          echo "main=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          UPSTREAM_TIP=$(git rev-parse upstream/main)
          BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_TIP" = "$BASE" ]; then
            echo "Upstream unchanged (tip=$UPSTREAM_TIP). No rebase needed."
            echo "rebased=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream moved: base=$BASE tip=$UPSTREAM_TIP"
            git log --oneline --boundary HEAD...upstream/main | head -n 20
            echo "rebased=true" >> $GITHUB_OUTPUT
          fi

      - name: Rebase onto upstream/main
        id: rebase
        if: steps.check.outputs.rebased == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_resolve_upstream_conflicts.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_check_deleted_paths.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_copilot_resolve.py
          BASE=$(git rev-parse HEAD)
          # Rebasing rewrites scripts/, so run copies from outside the tree.
          TOOLS="$RUNNER_TEMP/sync-tools"
          mkdir -p "$TOOLS"
          cp scripts/sync_rebase.sh scripts/resolve_upstream_conflicts.py scripts/copilot_resolve.py "$TOOLS"
          "$TOOLS/sync_rebase.sh" upstream/main "$RUNNER_TEMP/sync"

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "::error::Rebase left conflict markers in the tree"
            exit 1
          fi
          # A file upstream deleted can still be referenced by a fork-only file
          # that merged cleanly, so no conflict is ever reported. Fail here.
          python3 scripts/check_deleted_paths.py --base "$BASE"
          git diff --check

      - name: Push the rebased candidate
        id: candidate
        if: steps.check.outputs.rebased == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.PLAYGROUND_SYNC_TOKEN }}
        run: |
          # The sync token has the Workflows permission required when upstream
          # commits change .github/workflows files.
          git push --force "https://x-access-token:$SYNC_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            HEAD:refs/heads/sync-candidate
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Upload sync reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: ${{ runner.temp }}/sync/*.md
          if-no-files-found: ignore

  # Compiling alone is not enough: an automatic resolution must pass exactly
  # what a push to main would be tested with.
  test:
    needs: rebase
    if: needs.rebase.outputs.rebased == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.rebase.outputs.candidate }}

  publish:
    needs: [rebase, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.rebase.outputs.candidate }}
          fetch-depth: 0
          token: ${{ secrets.PLAYGROUND_SYNC_TOKEN }}

      - name: Promote the candidate to main
        run: |
          # The rebase rewrites history, so this is never a fast-forward. The
          # lease only succeeds if main is still the commit the sync rebased,
          # so a push made while the candidate was tested is never clobbered.
          git push --force-with-lease=main:${{ needs.rebase.outputs.main }} \
            origin ${{ needs.rebase.outputs.candidate }}:refs/heads/main

  release:
    # A rebased push triggers Test, which triggers release.yml. Releasing
    # here as well would race that workflow for the same tag.
    needs: rebase
    if: needs.rebase.outputs.rebased != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playground main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PLAYGROUND_SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if release needed
        id: release-check
        run: |
          set -e
          # Generate the playground tag (same scheme as upstream).
          COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          SHA_OCTAL=$(printf '%o' "0x${SHORT_SHA}")
          TAG="v0.${COUNT}.9${SHA_OCTAL}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Skip if this tag already exists (release already published).
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG is new — will create release."
          fi

      - name: Set up Go
        if: steps.release-check.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js and pnpm
        if: steps.release-check.outputs.exists == 'false'
        run: |
          dirs="$(scripts/with-node)"
          echo "${dirs//:/$'\n'}" >> "$GITHUB_PATH"

      - name: Fetch embedded exe-scroll binaries
        if: steps.release-check.outputs.exists == 'false'
        run: python3 scripts/fetch-exe-scroll.py --all --wait 1800

      - name: Build UI
        if: steps.release-check.outputs.exists == 'false'
        env:
          NO_SOURCEMAPS: '1'
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build templates
        if: steps.release-check.outputs.exists == 'false'
        run: |
          for dir in templates/*/; do
            name=$(basename "$dir")
            tar -czf "templates/$name.tar.gz" -C "templates/$name" --exclude='.DS_Store' .
          done

      - name: Create tag
        if: steps.release-check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.release-check.outputs.tag }}"
          git tag -a "$TAG" -m "Sync upstream: $TAG"
          git push origin "$TAG"

      - name: Run GoReleaser
        if: steps.release-check.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report:
    needs: [rebase, test, publish, release]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download sync reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sync-report

      - name: Open, update, or close the sync-failure issue
        run: |
          set -euo pipefail
          stage=""
          case "${{ needs.rebase.result }}" in
            failure|cancelled) stage="rebasing onto upstream" ;;
          esac
          case "${{ needs.test.result }}" in
            failure|cancelled) stage="testing the rebased candidate (it is kept on the sync-candidate branch)" ;;
          esac
          case "${{ needs.publish.result }}" in
            failure|cancelled) stage="promoting the candidate to main (did main move during the sync?)" ;;
          esac
          case "${{ needs.release.result }}" in
            failure|cancelled) stage="releasing the unchanged main" ;;
          esac
          gh label create sync-failure --color B60205 \
            --description "The nightly upstream sync needs attention" 2>/dev/null || true
          issue=$(gh issue list --label sync-failure --state open --json number --jq '.[0].number // empty')
          if [ -z "$stage" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Resolved: the sync succeeded in $RUN_URL."
            fi
            if [ -f ai-resolution.md ]; then
              gh label create sync-ai-resolved --color 5319E7 \
                --description "Copilot resolved a sync conflict; review after the fact" 2>/dev/null || true
              {
                echo "Copilot resolved conflicts the deterministic resolver refused, and the"
                echo "result passed the full Test workflow before it was promoted to main: $RUN_URL"
                echo
                echo "Review the decisions below. To undo one, fix it on main (or revert the"
                echo "release); the next sync keeps whatever main has."
                echo
                cat ai-resolution.md
              } > body.md
              gh issue create --title "Copilot resolved a sync conflict ($(date -u +%F))" \
                --label sync-ai-resolved --body-file body.md
            fi
            exit 0
          fi
          {
            echo "The upstream sync failed while **$stage** on $(date -u +%F): $RUN_URL"
            echo
            if [ -f sync-report.md ]; then cat sync-report.md; fi
            if [ -f ai-resolution.md ]; then
              echo
              echo "Copilot resolved some conflicts before the failure:"
              echo
              cat ai-resolution.md
            fi
            echo
            echo 'See docs/maintaining-the-fork.md for triage.'
          } > body.md
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file body.md
          else
            gh issue create --title "Upstream sync is failing" --label sync-failure --body-file body.md
          fi
