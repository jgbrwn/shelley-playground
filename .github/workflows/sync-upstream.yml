name: Sync upstream & release

# Keeps shelley-playground fresh: every day at 03:00 UTC (and on demand),
# fetch upstream boldsoftware/shelley main, rebase the playground commits
# onto it, and publish a GitHub release with cross-compiled binaries via
# goreleaser. If upstream hasn't moved, we still re-release when the latest
# release tag is older than a day or missing — so the Releases page is
# always fresh.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: playground-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playground main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PLAYGROUND_SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/boldsoftware/shelley.git
          else
            git remote add upstream https://github.com/boldsoftware/shelley.git
          fi
          git fetch upstream main --tags --prune

      - name: Check upstream state
        id: check
        run: |
          set -e
          UPSTREAM_TIP=$(git rev-parse upstream/main)
          BASE=$(git merge-base HEAD upstream/main)
          if [ "$UPSTREAM_TIP" = "$BASE" ]; then
            echo "Upstream unchanged (tip=$UPSTREAM_TIP). No rebase needed."
            echo "rebased=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream moved: base=$BASE tip=$UPSTREAM_TIP"
            git log --oneline --boundary HEAD...upstream/main | head -n 20
            echo "rebased=true" >> $GITHUB_OUTPUT
          fi

      - name: Rebase onto upstream/main
        id: rebase
        if: steps.check.outputs.rebased == 'true'
        run: |
          set -euo pipefail

          resolve_known_conflicts() {
            conflicts=$(git diff --name-only --diff-filter=U)
            if python3 <<'PY'
          import subprocess
          from pathlib import Path

          conflicts = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True
          ).splitlines()
          known_paths = {"server/server.go", "ui/src/vue/App.vue"}
          if not conflicts or any(name not in known_paths for name in conflicts):
              print("Unexpected rebase conflicts:")
              print("\n".join(conflicts))
              raise SystemExit("unexpected rebase conflict paths")

          deploy_assignment = "s.deployManager = deploy.NewManager(nil) // runs persisted on completion via persistRun"
          deploy_modal_declaration = "const deployModalOpen = ref(false);"

          def is_finder_comment(line):
              stripped = line.strip()
              return (
                  stripped.startswith("// Fuzzy file finder (")
                  and stripped.endswith("+ the generic editor it opens.")
              )

          def resolve_file(path):
              lines = path.read_text().splitlines(keepends=True)
              merged = []
              i = 0

              while i < len(lines):
                  if not lines[i].startswith("<<<<<<< "):
                      merged.append(lines[i])
                      i += 1
                      continue

                  i += 1
                  ours = []
                  while i < len(lines) and not lines[i].startswith("=======\n"):
                      ours.append(lines[i])
                      i += 1
                  if i == len(lines):
                      raise SystemExit(f"unterminated rebase conflict in {path}")

                  i += 1
                  theirs = []
                  while i < len(lines) and not lines[i].startswith(">>>>>>> "):
                      theirs.append(lines[i])
                      i += 1
                  if i == len(lines):
                      raise SystemExit(f"unterminated rebase conflict in {path}")
                  i += 1

                  ours_content = [line for line in ours if line.strip()]
                  theirs_content = [line for line in theirs if line.strip()]
                  if not ours_content and not theirs_content:
                      raise SystemExit(f"empty rebase conflict in {path}")

                  if path == Path("ui/src/vue/App.vue"):
                      if not (
                          len(ours_content) == 1
                          and is_finder_comment(ours_content[0])
                          and len(theirs_content) == 2
                          and deploy_modal_declaration in {line.strip() for line in theirs_content}
                          and sum(is_finder_comment(line) for line in theirs_content) == 1
                      ):
                          raise SystemExit(
                              "ui/src/vue/App.vue conflict is not the known deploy shortcut conflict"
                          )
                      content = [
                          next(
                              line
                              for line in theirs_content
                              if line.strip() == deploy_modal_declaration
                          ),
                          ours_content[0],
                      ]
                  else:
                      content = ours_content + theirs_content

                      def safe(line):
                          stripped = line.strip()
                          return (
                              (stripped.startswith('"') and stripped.endswith('"'))
                              or stripped.startswith("s.integrationSkills = ")
                              or stripped == deploy_assignment
                          )

                      if not all(safe(line) for line in content):
                          raise SystemExit(
                              "server/server.go conflict is not a known additive conflict"
                          )
                      if all(line.strip().startswith('"') for line in content):
                          content.sort(key=str.strip)

                  for line in content:
                      if line not in merged:
                          merged.append(line)

              path.write_text("".join(merged))

          for name in conflicts:
              resolve_file(Path(name))
          PY
            then
              :
            else
              return 1
            fi
            while IFS= read -r conflict; do
              if [ "$conflict" = "server/server.go" ] && ! gofmt -w server/server.go; then
                return 1
              fi
              if ! git add -- "$conflict"; then
                return 1
              fi
            done <<< "$conflicts"
          }

          if GIT_EDITOR=true git rebase upstream/main; then
            :
          else
            while true; do
              if ! resolve_known_conflicts; then
                git rebase --abort
                exit 1
              fi
              if GIT_EDITOR=true git rebase --continue; then
                break
              fi
            done
          fi

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "::error::Rebase left conflict markers in the tree"
            exit 1
          fi
          git diff --check

      - name: Push rebased main
        if: steps.check.outputs.rebased == 'true'
        run: |
          # The rebase rewrites history, so this is never a fast-forward.
          # The sync token has the Workflows permission required when upstream
          # commits change .github/workflows files.
          # --force-with-lease is safe: it only succeeds if remote main hasn't
          # changed since we fetched it (no clobbering of others' work).
          git push --force-with-lease origin HEAD:main

      - name: Check if release needed
        id: release-check
        # A rebased push triggers Test, which triggers release.yml. Releasing
        # here as well would race that workflow for the same tag.
        if: steps.check.outputs.rebased != 'true'
        run: |
          set -e
          # Generate the playground tag (same scheme as upstream).
          COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          SHA_OCTAL=$(printf '%o' "0x${SHORT_SHA}")
          TAG="v0.${COUNT}.9${SHA_OCTAL}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Skip if this tag already exists (release already published).
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag $TAG already exists — skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag $TAG is new — will create release."
          fi

      - name: Set up Go
        if: steps.release-check.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up pnpm
        if: steps.release-check.outputs.exists == 'false'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Set up Node.js
        if: steps.release-check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Fetch embedded exe-scroll binaries
        if: steps.release-check.outputs.exists == 'false'
        run: python3 scripts/fetch-exe-scroll.py --all --wait 1800

      - name: Build UI
        if: steps.release-check.outputs.exists == 'false'
        env:
          NO_SOURCEMAPS: '1'
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build templates
        if: steps.release-check.outputs.exists == 'false'
        run: |
          for dir in templates/*/; do
            name=$(basename "$dir")
            tar -czf "templates/$name.tar.gz" -C "templates/$name" --exclude='.DS_Store' .
          done

      - name: Create tag
        if: steps.release-check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.release-check.outputs.tag }}"
          git tag -a "$TAG" -m "Sync upstream: $TAG"
          git push origin "$TAG"

      - name: Run GoReleaser
        if: steps.release-check.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on conflict
        if: ${{ failure() && steps.rebase.outcome == 'failure' }}
        run: |
          echo "::error::Automatic rebase onto upstream/main hit an unsupported conflict. Rebase manually: git fetch upstream main && git rebase upstream/main, resolve, then push."
          exit 1
