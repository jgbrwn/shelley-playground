name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Install UI dependencies
        run: |
          cd ui
          pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          cd ui
          pnpm test

      - name: Build UI
        run: |
          cd ui
          pnpm run build

      - name: Build templates
        run: |
          for dir in templates/*/; do
            name=$(basename "$dir")
            echo "Creating $name.tar.gz..."
            tar -czf "templates/$name.tar.gz" -C "templates/$name" --exclude='.DS_Store' .
          done

      - name: Fetch embedded exe-scroll
        run: python3 scripts/fetch-exe-scroll.py --native --wait 300

      - name: Run Go tests
        run: go test -v ./...

      # Unit tests run on Linux/amd64; compile the platform-sensitive tool
      # package for the other release targets before Release runs.
      - name: Compile release-target tool package
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/claudetool-linux-arm64.test ./claudetool
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/claudetool-darwin-amd64.test ./claudetool
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/claudetool-darwin-arm64.test ./claudetool

      - name: Build shelley binary
        run: go build -o bin/shelley ./cmd/shelley

      - name: Install Playwright browsers
        if: false
        run: |
          cd ui
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        if: false
        run: |
          cd ui
          npx playwright test

      - name: Upload Playwright report
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
