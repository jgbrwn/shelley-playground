name: Release

on:
  workflow_run:
    workflows: ["Test"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: playground-release
  cancel-in-progress: false

jobs:
  goreleaser:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Generate version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get commit count as version number
          COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short=6 HEAD)
          # Convert 6-char hex SHA to octal, prefixed with 9 to ensure valid semver
          SHA_OCTAL=$(printf '%o' "0x${SHORT_SHA}")
          VERSION="0.${COUNT}.9${SHA_OCTAL}"
          TAG="v${VERSION}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          # A scheduled sync and a push-triggered release can target the same
          # commit. Serialize releases and make retries idempotent.
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Release $TAG already exists — skipping."
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Tag $TAG exists without a release — retrying release."
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG ($SHORT_SHA)"
            git push origin "$TAG"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch embedded exe-scroll binaries
        if: steps.version.outputs.skip != 'true'
        run: python3 scripts/fetch-exe-scroll.py --all --wait 1800

      - name: Set up Go
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up pnpm
        if: steps.version.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Set up Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build UI
        if: steps.version.outputs.skip != 'true'
        env:
          # Drop JS source maps from release binaries (~6MB compressed) since
          # they're only useful with devtools open. Dev builds keep them.
          NO_SOURCEMAPS: '1'
        run: |
          cd ui
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build templates
        if: steps.version.outputs.skip != 'true'
        run: |
          for dir in templates/*/; do
            name=$(basename "$dir")
            echo "Creating $name.tar.gz..."
            tar -czf "templates/$name.tar.gz" -C "templates/$name" --exclude='.DS_Store' .
          done

      - name: Run GoReleaser
        if: steps.version.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# The headless-shell (Chromium) release step is intentionally omitted from
# the playground fork. Upstream Shelley publishes headless-shell as a separate
# GitHub release on boldsoftware/shelley; the playground fork downloads it
# from there at build time (scripts/fetch-exe-scroll.py and the headless-shell
# upgrade flow in the version dialog both point at upstream). Publishing a
# duplicate headless-shell release here would pollute the Releases page and
# steal the "Latest" tag from the actual Shelley Playground binary release.
